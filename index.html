        .container { max-width: 650px; margin: 40px auto; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1 { font-size: 1.5rem; color: var(--text); margin-top: 0; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        .progress { font-size: 0.875rem; color: #64748b; margin-bottom: 10px; }
        .question { font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .btn-option { background-color: var(--card-bg); border: 1px solid var(--border); padding: 14px 20px; border-radius: 8px; text-align: left; font-size: 1rem; cursor: pointer; transition: all 0.2s ease; color: var(--text); }
        .btn-option:hover { background-color: #f1f5f9; border-color: #cbd5e1; }
        .btn-option.correct { background-color: #dcfce7; border-color: var(--success); color: #14532d; font-weight: 600; }
        .btn-option.incorrect { background-color: #fee2e2; border-color: var(--error); color: #7f1d1d; }
        .feedback { margin-top: 16px; padding: 14px; border-radius: 8px; font-size: 0.95rem; display: none; }
        .feedback.show { display: block; }
        .feedback-success { background-color: #f0fdf4; border-left: 4px solid var(--success); color: #166534; }
        .feedback-error { background-color: #fef2f2; border-left: 4px solid var(--error); color: #991b1b; }
        .hint-box { margin-top: 12px; display: none; }
        .hint-box.show { display: block; }
        .hint-toggle { background: none; border: 1px solid #94a3b8; color: #64748b; padding: 7px 14px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; margin-top: 12px; }
        .hint-toggle:hover { background: #f1f5f9; }
        .hint-content { margin-top: 8px; padding: 12px 14px; background: #fefce8; border-left: 4px solid #eab308; border-radius: 6px; font-size: 0.9rem; color: #713f12; }
        .btn-next { display: none; margin-top: 20px; background-color: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 1rem; cursor: pointer; font-weight: 600; width: 100%; transition: background 0.2s; }
        .btn-next:hover { background-color: var(--primary-hover); }
        .result-screen { text-align: center; }
        .score { font-size: 3rem; font-weight: bold; color: var(--primary); margin: 20px 0; }
        .btn-restart { background-color: var(--text); color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-top: 20px; }
    </style>
</head>

let current = 0, score = 0, answered = false, hintVisible = false;

function loadQuestion() {
    answered = false; hintVisible = false;
    const q = quizData[current];
    document.getElementById('progress').textContent = `Запитання ${current + 1} з ${quizData.length}`;
    document.getElementById('question-text').textContent = q.question;
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.textContent = opt;
        btn.onclick = () => selectAnswer(i);
        container.appendChild(btn);
    });
    document.getElementById('feedback-box').className = 'feedback';
    document.getElementById('feedback-box').textContent = '';
    document.getElementById('hint-btn').style.display = 'block';
    document.getElementById('hint-btn').textContent = '💡 Показати підказку';
    document.getElementById('hint-box').className = 'hint-box';
    document.getElementById('hint-text').textContent = q.hint;
    document.getElementById('next-btn').style.display = 'none';
}

function selectAnswer(idx) {
    if (answered) return;
    answered = true;
    const q = quizData[current];
    const buttons = document.querySelectorAll('.btn-option');
    buttons.forEach(b => b.style.pointerEvents = 'none');
    const fb = document.getElementById('feedback-box');
    if (idx === q.correct) {
        score++;
        buttons[idx].classList.add('correct');
        fb.className = 'feedback feedback-success show';
    } else {
        buttons[idx].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
        fb.className = 'feedback feedback-error show';
    }
    fb.textContent = q.comments[idx];
    document.getElementById('hint-btn').style.display = 'none';
    document.getElementById('hint-box').className = 'hint-box';
    const nextBtn = document.getElementById('next-btn');
    nextBtn.style.display = 'block';
    nextBtn.textContent = current < quizData.length - 1 ? 'Далі →' : 'Завершити';
}

function toggleHint() {
    hintVisible = !hintVisible;
    document.getElementById('hint-box').className = 'hint-box' + (hintVisible ? ' show' : '');
    document.getElementById('hint-btn').textContent = hintVisible ? '💡 Сховати підказку' : '💡 Показати підказку';
}

function nextQuestion() {
    current++;
    if (current < quizData.length) loadQuestion();
    else showResult();
}

function showResult() {
    document.getElementById('quiz-box').style.display = 'none';
    document.getElementById('result-box').style.display = 'block';
    document.getElementById('score-text').textContent = `${score} / ${quizData.length}`;
    const pct = score / quizData.length;
    let c = pct === 1 ? '🏆 Відмінно! Ви чудово знаєте тему безбар\'єрності!'
           : pct >= 0.8 ? '👍 Дуже добре! Є кілька моментів для закріплення.'
           : pct >= 0.6 ? '📚 Непогано! Варто повторити окремі теми.'
           : '📖 Рекомендуємо ще раз опрацювати матеріал і спробувати знову.';
    document.getElementById('result-comment').textContent = c;
}

function restartQuiz() {
    current = 0; score = 0;
    document.getElementById('quiz-box').style.display = 'block';
    document.getElementById('result-box').style.display = 'none';
    loadQuestion();
}

loadQuestion();
</script>
